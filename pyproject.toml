[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.sdist]
include = [
    "AUTHORS.rst",
    "docs/",
    "examples/",
    "src/",
    "tests/",
    ".coveragerc",
    ".readthedocs.yml",
    "VERSION",
    "tox.ini",
]
exclude = ["docs/_build"]


[project]
name = "dhnx"
dynamic = ["version"]
description = "Optimization of district heating and cooling networks."
readme = "README.rst"
authors = [
    {name = "oemof developer group", email = "contact@oemof.org"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    "pandas >= 2.2.0",
    'matplotlib',
    'networkx',
    'pillow',
    'folium',
    'addict',
    'oemof.solph >= 0.6.2',
    'scipy >= 1.5',
]
license = "MIT"
license-files = [
    "LICENSE",
]

[project.urls]
Homepage = "https://github.com/oemof/DHNx"
Documentation = "https://dhnx.readthedocs.io/en/latest/"
Changelog = "https://dhnx.readthedocs.io/en/latest/whats_new.html"
"Issue Tracker" = "https://github.com/oemof/DHNx/issues/"

[project.optional-dependencies]
"dev" = [
    "sphinx",
    "sphinx-rtd-theme",
    "tox",
]
"gis" = [
    "cartopy",
    "geopandas",
    "osmnx >= 2.0.7",
]
"hydraulic" = [
    "CoolProp",
]

[tool.black]
line-length = 79
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | ci
)/
'''

[tool.pytest.ini_options]
norecursedirs = [
    ".git",
    ".tox",
    ".env",
    "dist",
    "build",
    "docs/_build",
    "docs/_files/code",
    "migrations",
    "examples",
]
python_files = [
    "test_*.py",
    "*_test.py",
    "*_tests.py",
    "tests.py",
]
addopts = """
    -ra
    --strict-markers
    --ignore=docs/conf.py
    --ignore=ci
    --ignore=.eggs
    --doctest-modules
    --doctest-glob=\\*.rst
    --tb=short
    --pyargs
"""
testpaths = [
    "src/dhnx/",
    "tests/",
    "docs/",
]

[tool.isort]
force_single_line = true
line_length = 79
known_first_party = "dhnx"
default_section = "THIRDPARTY"
forced_separate = "test_dhnx"
skip = "migrations"

[tool.ruff]
line-length = 79

